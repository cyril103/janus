version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /website
      - /registry
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /website
    schedule:
      interval: weekly
    groups:
      site-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
