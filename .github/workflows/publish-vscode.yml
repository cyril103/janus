name: Publish VS Code extension

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  handoff:
    name: Package and publish tagged VSIX
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve release tag
        id: release
        env:
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REQUESTED_TAG: ${{ inputs.tag || '' }}
        run: |
          tag="${PUSH_TAG:-$REQUESTED_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v0.7.6, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Verify tag and extension versions
        working-directory: editors/vscode
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          if [[ "v$package_version" != "$RELEASE_TAG" ||
                "$lock_version" != "$package_version" ]]; then
            echo "Tag, package and lockfile versions must match" >&2
            exit 1
          fi

      - name: Install locked dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Test extension
        working-directory: editors/vscode
        run: npm test

      - name: Package VSIX and list its content
        working-directory: editors/vscode
        run: |
          npm run package -- --out janus-language.vsix
          npx vsce ls --tree

      - name: Produce SHA-256 checksum
        working-directory: editors/vscode
        run: |
          sha256sum janus-language.vsix > janus-language.vsix.sha256

      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'push'
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          npm exec -- vsce publish --packagePath janus-language.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: github.event_name == 'push'
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT"
          npm exec -- ovsx publish janus-language.vsix -p "$OVSX_PAT"

      - name: Upload VSIX handoff artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: janus-vscode-${{ steps.release.outputs.tag }}
          path: |
            editors/vscode/janus-language.vsix
            editors/vscode/janus-language.vsix.sha256
          if-no-files-found: error
