name: Deploy Janus website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "stdlib/std/**"
      - "tools/janus/**"
      - "scripts/check_public_surface.py"
      - "scripts/check_stability_inventory.py"
      - "tests/fixtures/documentation/**"
      - "tests/documentation/**"
      - "CMakeLists.txt"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "stdlib/std/**"
      - "tools/janus/**"
      - "scripts/check_public_surface.py"
      - "scripts/check_stability_inventory.py"
      - "tests/fixtures/documentation/**"
      - "tests/documentation/**"
      - "CMakeLists.txt"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install site dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Install Janus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18-dev ninja-build
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Build the documentation compiler
        run: |
          cmake -S . -B build-pages -G Ninja \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build-pages --target janus --parallel

      - name: Check public surface and snippets
        run: |
          build-pages/janus doc --stdlib --offline \
            -o build-pages/stdlib-reference
          cmp build-pages/stdlib-reference/api-index.json \
            website/docs/reference/stdlib/api-index.json
          cmp build-pages/stdlib-reference/index.html \
            website/docs/reference/stdlib/index.html
          python scripts/check_public_surface.py \
            --root . \
            --janus build-pages/janus
          python scripts/check_stability_inventory.py --root .
          python website/tests/check_janus_snippets.py \
            --compiler build-pages/janus

      - name: Test site structure and links
        run: python -m unittest discover -s website/tests -v

      - name: Build the static site
        run: mkdocs build --strict -f website/mkdocs.yml -d "$GITHUB_WORKSPACE/_site"

      - name: Check generated internal links
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory _site >/tmp/janus-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          python website/tests/check_public_links.py http://127.0.0.1:8000/

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
