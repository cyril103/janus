name: Compiler performance dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  actions: read # Read the previous successful dashboard artifact.
  contents: read # Check out benchmark sources.

concurrency:
  group: compiler-performance-dashboard
  cancel-in-progress: false

jobs:
  benchmark:
    name: Five-sample compilation trend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18-dev ninja-build
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=/usr/lib/llvm-18/bin/clang
          -DCMAKE_CXX_COMPILER=/usr/lib/llvm-18/bin/clang++
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build compiler
        run: cmake --build build --target janus --parallel

      - name: Run versioned benchmarks
        run: |
          python3 scripts/benchmark-compilation.py \
            --janus "$GITHUB_WORKSPACE/build/janus" \
            --benchmarks benchmarks/compilation \
            --samples 5 \
            --output build/compiler-performance.json

      - name: Find previous dashboard run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/compiler-performance.yml/runs" \
            -f status=success \
            -f branch="$GITHUB_REF_NAME" \
            -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download previous trend state
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compiler-performance-trend
          path: previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Evaluate non-blocking trend
        run: |
          previous=()
          if test -f previous/compiler-performance-trend.json; then
            previous=(--previous previous/compiler-performance-trend.json)
          fi
          python3 scripts/compilation-trend.py \
            --current build/compiler-performance.json \
            "${previous[@]}" \
            --output build/compiler-performance-trend.json \
            --summary build/compiler-performance-summary.md
          cat build/compiler-performance-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish dashboard data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiler-performance-trend
          path: |
            build/compiler-performance.json
            build/compiler-performance-trend.json
            build/compiler-performance-summary.md
          if-no-files-found: error
