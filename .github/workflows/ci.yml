name: Janus CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_fuzz:
        description: Run the four 60-minute sanitizer campaigns
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  test-source-policy:
    name: Test source policy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject disabled standard assertions
        run: python3 scripts/check-test-asserts.py tests

      - name: Verify assertion guard
        run: python3 scripts/check-test-asserts.py --self-test

      - name: Reject mutable GitHub Actions references
        run: python3 scripts/check-github-actions-pins.py .

      - name: Verify GitHub Actions pin guard
        run: python3 scripts/check-github-actions-pins.py --self-test

      - name: Reject semantically mutable action references
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          config: .github/zizmor-pin-policy.yml
          persona: regular
          min-severity: high
          online-audits: false
          advanced-security: false
          annotations: true

  reference-registry-image:
    name: Reference registry image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose deployment
        env:
          JANUS_REGISTRY_ORIGIN: https://registry.example
          JANUS_REGISTRY_BIND: 127.0.0.1
          JANUS_REGISTRY_DATA_DIR: /tmp/janus-registry-data
          JANUS_REGISTRY_KEY_ID: ci-key-v1
          JANUS_REGISTRY_SIGNING_KEY_FILE: /tmp/janus-registry-signing.key
        run: docker compose -f registry/compose.yaml config --quiet

      - name: Build reference registry image
        run: docker build --tag janus-reference-registry:test registry

      - name: Smoke test reference registry image
        run: scripts/smoke-test-reference-registry-image.sh

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Test extension
        working-directory: editors/vscode
        run: npm test

      - name: Package extension
        working-directory: editors/vscode
        run: |
          npm run package -- --out janus-language.vsix
          sha256sum janus-language.vsix > janus-language.vsix.sha256

      - name: Upload extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: janus-vscode
          path: |
            editors/vscode/janus-language.vsix
            editors/vscode/janus-language.vsix.sha256
          if-no-files-found: error

  toolchain:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            llvm_dir: /usr/lib/llvm-18/lib/cmake/llvm
            cc: /usr/lib/llvm-18/bin/clang
            cxx: /usr/lib/llvm-18/bin/clang++
            janus_clang: /usr/lib/llvm-18/bin/clang
            janus_lld: /usr/lib/llvm-18/bin/ld.lld
          - name: macOS ARM64
            os: macos-14
            llvm_dir: /opt/homebrew/opt/llvm@21/lib/cmake/llvm
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            janus_clang: /opt/homebrew/opt/llvm@21/bin/clang
            janus_lld: /opt/homebrew/opt/lld@21/bin/ld.lld
          - name: Windows x86_64
            os: windows-2025

    runs-on: ${{ matrix.os }}
    env:
      EULER_CASE_TIMEOUT: 5
      EULER_GLOBAL_TIMEOUT: 120
      EULER_MAX_ERRORS: 0
      MATRIX_CC: ${{ matrix.cc }}
      MATRIX_CXX: ${{ matrix.cxx }}
      MATRIX_LLVM_DIR: ${{ matrix.llvm_dir }}
      MATRIX_JANUS_CLANG: ${{ matrix.janus_clang }}
      MATRIX_JANUS_LLD: ${{ matrix.janus_lld }}

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18-dev ninja-build
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 lld@21 ninja
          echo "/opt/homebrew/opt/llvm@21/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld@21/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-python

      - name: Pin Windows LLVM stack to 21.1.8
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          base=https://repo.msys2.org/mingw/clang64
          pacman --noconfirm -U \
            "$base/mingw-w64-clang-x86_64-llvm-libs-21.1.8-4-any.pkg.tar.zst" \
            "$base/mingw-w64-clang-x86_64-llvm-tools-21.1.8-4-any.pkg.tar.zst" \
            "$base/mingw-w64-clang-x86_64-llvm-21.1.8-4-any.pkg.tar.zst" \
            "$base/mingw-w64-clang-x86_64-compiler-rt-21.1.8-4-any.pkg.tar.zst" \
            "$base/mingw-w64-clang-x86_64-lld-21.1.8-4-any.pkg.tar.zst" \
            "$base/mingw-w64-clang-x86_64-clang-libs-21.1.8-4-any.pkg.tar.zst" \
            "$base/mingw-w64-clang-x86_64-clang-21.1.8-4-any.pkg.tar.zst"

      - name: Configure
        if: runner.os != 'Windows'
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER="$MATRIX_CC"
          -DCMAKE_CXX_COMPILER="$MATRIX_CXX"
          -DLLVM_DIR="$MATRIX_LLVM_DIR"
          -DJANUS_CLANG_EXECUTABLE="$MATRIX_JANUS_CLANG"
          -DJANUS_LLD_EXECUTABLE="$MATRIX_JANUS_LLD"
          -DJANUS_SOURCE_SHA="$GITHUB_SHA"

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=/clang64/bin/clang.exe
          -DCMAKE_CXX_COMPILER=/clang64/bin/clang++.exe
          -DLLVM_DIR=/clang64/lib/cmake/llvm
          -DJANUS_CLANG_EXECUTABLE=/clang64/bin/clang.exe
          -DJANUS_LLD_EXECUTABLE=/clang64/bin/ld.lld.exe
          -DJANUS_SOURCE_SHA="$GITHUB_SHA"

      - name: Build
        run: cmake --build build --parallel

      - name: Test on Linux (Euler runs in the explicit gate)
        if: runner.os == 'Linux'
        run: >
          ctest --test-dir build --output-on-failure
          --stop-on-failure --timeout 60
          --exclude-regex '^project_euler\.smoke$'

      - name: Test on macOS
        if: runner.os == 'macOS'
        run: >
          ctest --test-dir build --output-on-failure
          --stop-on-failure --timeout 60

      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >
          ctest --test-dir build --output-on-failure
          --stop-on-failure --timeout 60

      - name: Euler 1..20 gate
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 3
        run: |
          scripts/verify-janus-euler-suite.sh \
            --project tests/fixtures/project-euler \
            --config tests/fixtures/project-euler/production.txt \
            --janus "${GITHUB_WORKSPACE}/build/janus" \
            --all \
            --timeout "${EULER_CASE_TIMEOUT}" \
            --global-timeout "${EULER_GLOBAL_TIMEOUT}" \
            --max-errors "${EULER_MAX_ERRORS}" \
            --json-out "${GITHUB_WORKSPACE}/build/euler-gate-report.json" \
            --artifacts-dir "${GITHUB_WORKSPACE}/build/euler-gate-artifacts"

      - name: Upload Euler gate report and artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: janus-euler-gate-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/euler-gate-report.json
            build/euler-gate-artifacts
          if-no-files-found: warn

      - name: Package
        run: cmake --build build --target dist

      - name: Smoke test packaged toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/smoke-test-package.sh build/janus-*.tar.gz

      - name: Smoke test packaged toolchain on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-test-package.ps1 build/janus-*.zip

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: janus-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/janus-*.tar.gz
            build/janus-*.tar.gz.sha256
            build/janus-*.zip
            build/janus-*.zip.sha256
          if-no-files-found: error

  linux-compatibility:
    name: Linux package on ${{ matrix.name }}
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Fedora 42
            image: fedora:42
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install native SDK on Ubuntu
        if: matrix.name == 'Ubuntu 24.04'
        run: >-
          apt-get update &&
          apt-get install --yes build-essential ca-certificates
          coreutils findutils gzip tar

      - name: Install native SDK on Fedora
        if: matrix.name == 'Fedora 42'
        run: >-
          dnf install --assumeyes gcc glibc-devel libstdc++-devel
          coreutils findutils gzip tar

      - name: Install native SDK on openSUSE
        if: matrix.name == 'openSUSE Tumbleweed'
        run: >-
          zypper --non-interactive install gcc glibc-devel
          libstdc++-devel coreutils findutils gzip tar

      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: janus-Linux-X64
          path: dist

      - name: Exercise installed toolchain
        shell: bash
        run: scripts/smoke-test-package.sh dist/janus-*.tar.gz

  release-compatibility:
    name: Latest published to current compatibility
    needs: toolchain
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download current Linux distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: janus-Linux-X64
          path: dist/current

      - name: Resolve latest published baseline
        id: baseline
        shell: bash
        run: |
          current_tag="v$(python3 -c \
            'import json; print(json.load(open("editors/vscode/package.json"))["version"])')"
          baseline_tag="$(
            gh release list --limit 50 \
              --json tagName,isDraft,isPrerelease \
              --jq "map(select(.isDraft == false and .isPrerelease == false and .tagName != \"$current_tag\"))[0].tagName // \"\""
          )"
          if [[ ! "$baseline_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve the latest stable Janus baseline" >&2
            exit 1
          fi
          echo "tag=$baseline_tag" >> "$GITHUB_OUTPUT"
          echo "version=${baseline_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download published baseline
        env:
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
        run: |
          gh release download "$BASELINE_TAG" \
            --pattern "janus-$BASELINE_VERSION-Linux-x86_64.tar.gz*" \
            --dir dist/previous

      - name: Verify and extract distributions
        shell: bash
        run: |
          (cd dist/current && sha256sum --check *.sha256)
          (cd dist/previous && sha256sum --check *.sha256)
          mkdir -p dist/current/root dist/previous/root
          tar -xzf dist/current/*.tar.gz -C dist/current/root
          tar -xzf dist/previous/*.tar.gz -C dist/previous/root

      - name: Exercise N/N+1 fixtures
        shell: bash
        run: |
          previous="$(find dist/previous/root -type f -path '*/bin/janus' -print -quit)"
          current="$(find dist/current/root -type f -path '*/bin/janus' -print -quit)"
          test -n "$previous" && test -n "$current"
          cmake \
            -DPREVIOUS_JANUS="$previous" \
            -DCURRENT_JANUS="$current" \
            -DFIXTURE_DIR="$GITHUB_WORKSPACE/tests/compatibility" \
            -DOUTPUT_DIR="$RUNNER_TEMP/compatibility-N-N+1" \
            -DEXECUTABLE_SUFFIX= \
            -P tests/compatibility/run_compatibility.cmake

  release-readiness:
    name: Public stability audit and critical gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate stability inventory and links
        run: python3 scripts/check_stability_inventory.py

      - name: Reject open critical issues
        shell: bash
        run: |
          count="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label severity:critical \
            --json number \
            --jq length)"
          if (( count != 0 )); then
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label severity:critical
            exit 1
          fi

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [toolchain, vscode-extension, linux-compatibility, release-compatibility, release-readiness]
    runs-on: ubuntu-24.04
    concurrency:
      group: janus-release-${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release version
        run: >
          cmake -DTAG="${GITHUB_REF_NAME}"
          -DSOURCE_DIR="${GITHUB_WORKSPACE}"
          -P cmake/verify_release_version.cmake

      - name: Reject stale channel promotion
        run: |
          channel=stable
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then channel=beta; fi
          arguments=(--candidate "$GITHUB_REF_NAME" --channel "$channel")
          channel_ref="refs/heads/channel-$channel"
          channel_sha="$(git ls-remote --refs origin "$channel_ref" | cut -f1)"
          if [[ -n "$channel_sha" ]]; then
            git fetch --no-tags origin "$channel_ref"
            git show FETCH_HEAD:version > "$RUNNER_TEMP/current-channel-version"
            arguments+=(--current "$RUNNER_TEMP/current-channel-version")
          else
            channel_sha=absent
          fi
          python3 scripts/nightly_release.py check-promotion "${arguments[@]}"
          package_version=$(python3 scripts/nightly_release.py project-version --source "$GITHUB_WORKSPACE/CMakeLists.txt")
          echo "JANUS_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "JANUS_CHANNEL_EXPECTED_SHA=$channel_sha" >> "$GITHUB_ENV"
          echo "JANUS_PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Download distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          for artifact in \
            janus-Linux-X64 \
            janus-macOS-ARM64 \
            janus-Windows-X64 \
            janus-vscode
          do
            command gh run download "$GITHUB_RUN_ID" \
              --name "$artifact" \
              --dir dist/release
          done

      - name: Verify complete release payload
        run: |
          version="$JANUS_PACKAGE_VERSION"
          distributions=(
            "janus-${version}-Linux-x86_64.tar.gz"
            "janus-${version}-Darwin-arm64.tar.gz"
            "janus-${version}-Windows-AMD64.zip"
            "janus-language.vsix"
          )
          for distribution in "${distributions[@]}"; do
            test -f "dist/release/$distribution"
            test -f "dist/release/$distribution.sha256"
          done
          (cd dist/release && sha256sum --check *.sha256)
          printf '%s\n' "${distributions[@]}" \
            > "$RUNNER_TEMP/release-distributions"

      - name: Downstream canaries from candidate archive
        id: downstream-canary
        run: |
          git clone https://github.com/cyril103/janus8.git janus8
          git -C janus8 checkout b962b69ea14a47016556f9e2a111c7dab1e2e02d
          git clone https://github.com/cyril103/janus-studio.git janus-studio
          git -C janus-studio checkout 176c16dab8b37be7d898c98ca98716457b39dbb7
          version="$JANUS_PACKAGE_VERSION"
          archive="dist/release/janus-${version}-Linux-x86_64.tar.gz"
          test -f "$archive" && test -f "$archive.sha256"
          python3 scripts/downstream_canary.py --archive "$archive" \
            --expected-revision "$GITHUB_SHA" \
            --janus8-checkout janus8 --studio-checkout janus-studio

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.vsix

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=(--verify-tag --generate-notes --latest=false)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          command gh release create "$GITHUB_REF_NAME" dist/release/* "${options[@]}"

      - name: Verify published release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r distribution; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "dist/release/$distribution" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow \
                  "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
                --source-digest "$GITHUB_SHA" \
                --source-ref "$GITHUB_REF"
              then
                verified=true
                break
              fi
              sleep $((attempt * 5))
            done
            test "$verified" = true
          done < "$RUNNER_TEMP/release-distributions"

      - name: Promote verified stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --latest

      - name: Update release channel
        run: |
          cmake -DSOURCE_DIR="$GITHUB_WORKSPACE" \
            -DRELEASE="$GITHUB_REF_NAME" \
            -DOUTPUT="$RUNNER_TEMP/version" \
            -P cmake/write_channel_manifest.cmake
          python3 scripts/promote_release_channel.py \
            --repository "$GITHUB_WORKSPACE" \
            --channel "$JANUS_RELEASE_CHANNEL" \
            --manifest "$RUNNER_TEMP/version" \
            --expected "$JANUS_CHANNEL_EXPECTED_SHA"

  diagnostic-fuzz:
    name: ${{ matrix.mode }} sanitizer campaign (60 min)
    if: github.event_name == 'schedule' || inputs.run_fuzz == true
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        mode: [lexer, parser, manifest, resolver]

    steps:
      - name: Check out Janus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18-dev ninja-build
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Configure sanitizer build
        run: >
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=/usr/lib/llvm-18/bin/clang
          -DCMAKE_CXX_COMPILER=/usr/lib/llvm-18/bin/clang++
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build compiler
        run: cmake --build build-fuzz --target janus --parallel

      - name: Fuzz ${{ matrix.mode }} for 60 minutes
        timeout-minutes: 62
        env:
          FUZZ_MODE: ${{ matrix.mode }}
        run: >
          python3 scripts/fuzz_frontend.py
          --janus build-fuzz/janus
          --mode "$FUZZ_MODE"
          --duration 3600
