name: janus-reference-registry

services:
  registry:
    image: janus-reference-registry:0.8.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      JANUS_REGISTRY_ORIGIN: ${JANUS_REGISTRY_ORIGIN:?set JANUS_REGISTRY_ORIGIN}
      JANUS_REGISTRY_KEY_ID: ${JANUS_REGISTRY_KEY_ID:?set JANUS_REGISTRY_KEY_ID}
    ports:
      - "${JANUS_REGISTRY_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - "${JANUS_REGISTRY_DATA_DIR:?set JANUS_REGISTRY_DATA_DIR}:/var/lib/janus-registry"
    secrets:
      - registry_signing_key

secrets:
  registry_signing_key:
    file: ${JANUS_REGISTRY_SIGNING_KEY_FILE:?set JANUS_REGISTRY_SIGNING_KEY_FILE}
