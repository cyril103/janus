      - Compteur CLI: tutorials/cli-compteur.md
      - Collections typées: tutorials/collections.md
      - Gestion des erreurs: tutorials/gestion-erreurs.md
      - Comprendre derives: tutorials/derives-copy-debug.md
      - Maîtriser move, borrow et consume: tutorials/propriete-move-consume.md
      - Atelier graphisme 2D: tutorials/atelier-graphisme-2d.md
      - Snake graphique: tutorials/snake-graphique.md
  - Référence:
      - Vue d’ensemble: reference/index.md
      - Installation: reference/generated/getting-started.md
      - Guide du langage: reference/generated/language-guide.md
      - Texte et parsing: reference/generated/text.md
      - Commandes et outils: reference/generated/tooling.md
      - Protocole du registre v1: reference/generated/registry-protocol-v1.md
      - Performance du compilateur: reference/generated/compiler-performance.md
      - Documentation d’API: reference/generated/api-documentation.md
      - Doctests: reference/generated/doctests.md
      - Diagnostics structurés: reference/generated/diagnostics.md
      - Guide de la bibliothèque standard: reference/generated/stdlib-reference.md
      - Index API de la stdlib: reference/stdlib/index.html
      - Graphisme 2D: reference/generated/graphics.md
      - Contrat de stabilité 1.0: reference/generated/stability-contract.md
      - Inventaire de stabilité 0.8: reference/generated/stability-inventory-0.8.md
      - Limites connues 0.8: reference/generated/known-limitations-0.8.md
      - Préparation à 1.0: reference/generated/readiness-1.0.md
      - Politique de sévérité 0.8: reference/generated/release-severity-policy-0.8.md
      - Migration 0.5 vers 0.6: reference/generated/migration-0.5-to-0.6.md
      - Migration 0.5 vers 0.8: reference/generated/migration-0.5-to-0.8.md
      - Compiler depuis les sources: reference/generated/development.md
theme:
  name: material
  language: fr
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
plugins:
  - search:
      lang: fr
hooks:
  - scripts/mkdocs_hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cyril103/janus
