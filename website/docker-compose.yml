services:
  web:
    build:
      context: ..
      dockerfile: website/Dockerfile
    image: janus-learning-site:local
    ports:
      - "${JANUS_SITE_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
